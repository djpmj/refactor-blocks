name: Scheduled PR Review

on:
  schedule:
    # 毎日 01:00 / 07:00 / 13:00 / 19:00 JST(= 前日16:00 / 前日22:00 / 04:00 / 10:00 UTC)
    # Dependabot PR(pull_requestイベントではsecretsが使えず即時レビューできない)を拾うための保険。
    - cron: "0 16 * * *"
    - cron: "0 22 * * *"
    - cron: "0 4 * * *"
    - cron: "0 10 * * *"
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch: {}

concurrency:
  # pull_requestイベントはPRごとに独立させ、スケジュール実行(全PR一括)とは別グループにする
  group: review-pr-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'scheduled' }}
  cancel-in-progress: false

jobs:
  review-pr:
    # pull_requestイベントで即時レビューを許可するのは、このリポジトリ内のブランチ同士のPRのみ。
    # - フォークからのPRはここで除外する: `npm ci`/`npm test`等をこのステップ内でフォーク側の
    #   コードとして実行するため、フォークの悪意あるコードがステップに渡したsecrets
    #   (CLAUDE_CODE_OAUTH_TOKEN)をプロセス環境から読み取れてしまうリスクを断つ。
    #   フォークPRはスケジュール実行(読み取り専用トークンでも動く手順)側で拾う。
    # - Dependabotが作成したPRへのpull_requestイベントはGitHub側の仕様でsecretsが渡らず
    #   認証に失敗するだけなので実行しない(スケジュール実行側で拾う)。
    # - ドラフトPRもここで除外する。
    if: |
      github.event_name != 'pull_request' ||
      (
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Run Claude Code PR review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            TRIGGER: ${{ github.event_name }}
            PR_NUMBER(pull_requestイベントの場合のみ有効): ${{ github.event.pull_request.number }}

            あなたはこのリポジトリのPRレビュー担当です。オープンなプルリクエストをレビューし、
            指摘(blocker)が無ければ自動でマージします。Dependabotが作成した依存更新PRも対象に
            含みますが、Dependabot PRやフォークからのPR自身のpushをきっかけにした起動
            (TRIGGER=pull_request)では、このジョブ自体が実行されない設定になっている
            (secretsが使えない、またはフォークの未信頼コードにsecretsを晒さないため)。
            これらのPRはスケジュール実行(TRIGGER=schedule)側で拾われる。

            まず `git config user.name "github-actions[bot]"` と
            `git config user.email "github-actions[bot]@users.noreply.github.com"` を設定する。

            0. 対象PRを次の通り決める。
               - TRIGGERが `pull_request` の場合: 対象は `PR_NUMBER` の1件のみ。
                 (PR作成時または指摘対応のpush時に起動しているので、一覧は不要)
               - TRIGGERが `schedule` または `workflow_dispatch` の場合: 従来通り
                 `gh pr list --state open --json number,title,headRefName,isDraft,updatedAt` で
                 オープンなPRを一覧し、ドラフトPRを除外して対象にする。
               対象PRが無ければ何もせず終了する。
            1. (手順0で対象PRを決定済み)
            2. 各対象PRについて、`gh pr view <番号> --json reviews,commits` で、このbot
               (`github-actions[bot]`、またはClaude Code経由の直近のレビュー)による最新レビューが
               現在の最新コミットに対して既に行われているか確認する。最新コミットへの変更が無い
               (前回レビュー以降に新しいコミットが無い)PRはスキップする
               (同じ内容を何度もレビュー・コメントしない)。
            3. スキップしないPRは、`.claude/commands/review-pr.md` の手順2〜4(PR情報・Issue・
               仕様書の取得、`npm ci`、`npm test`/`npm run lint`/`npm run typecheck`
               [UIの操作に関わる変更があれば `npm run test:e2e` も]の実行、差分レビュー)に
               そのまま従ってレビューする。ただし関連Issue・仕様書のどちらも無いPR
               (Dependabotの依存更新PRなど)は、受け入れ基準の代わりに `CLAUDE.md` の開発ルールと、
               実行結果(lint/typecheck/test)が通ることを判断基準にする。
            4. **blockerが無い場合**: `.claude/commands/review-pr.md` 手順5に従い、
               `gh pr review <番号> --approve --body "<判定と実行結果の要約>"` でコメントする。
               このワークフローはヘッドレス実行でユーザーにその場で確認を取れないため、同手順にある
               「ユーザーに確認してから行う」は適用せず、承認・マージ・Issueクローズをそのまま
               自動で実行してよい。続けて `gh pr diff <番号> --name-only` で変更ファイルを確認し、
               `.github/workflows/` 配下を**含まない**場合のみ
               `gh pr merge <番号> --squash --delete-branch` でマージし、関連Issueが自動クローズ
               されていなければ `gh issue close <issue番号>` で閉じる。
               `.github/workflows/` 配下を**含む**場合は `gh pr merge` を実行しない
               (このワークフローが使うGitHub Appには `workflows` 権限が無く、GraphQL側で
               `refusing to allow a GitHub App to create or update workflow ... without
               'workflows' permission` として必ず失敗するため、失敗すると分かっている操作を
               試行しない。承認コメントのみ投稿し、人が手動でマージする)。
               マージしたPRに対応する `docs/specs/<slug>.md` があれば、`docs/specs/implemented.md` の
               「## 一覧」表に1行追加してコミットに含める(`.claude/commands/review-pr.md` 手順5参照。
               仕様書が無いPRではこの追記をしない)。
               続けて、何を確認してどう判断したかを `docs/review-pr/LOG.md` の書式(ファイル冒頭、
               自動マージした場合/`.github/workflows/`を含み見送った場合の2パターンがある)に従って
               「## ログ一覧」見出し直後に追記する。記録が30件を超えていたら、古いものから
               削除して直近30件までに収める。`git add docs/review-pr/LOG.md` し、
               「PR #<番号>のレビューログを追記」のような日本語コミットメッセージ(末尾に
               `Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>`)でコミットし、
               `git push origin HEAD:master` する。
            5. **blockerがある場合**: `.claude/commands/review-pr.md` 手順6に従い、マージせず
               `gh pr review <番号> --request-changes --body "<指摘内容>"` で指摘をコメントする
               (この場合もユーザーへの確認は不要、そのまま投稿する)。`docs/review-pr/LOG.md`
               には書かない。
            6. 対象PRをすべて処理したら終了する(1回の起動で複数PRを処理してよい)。

            `src/` 配下のコードは変更しない(レビューのみ。修正はPR作成者・`/implement` 側で行う)。
          claude_args: |
            --max-turns 200
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(npm:*),Bash(gh pr:*),Bash(gh issue:*)"

      - name: Upload Claude execution log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-execution-output
          path: /home/runner/work/_temp/claude-execution-output.json
          if-no-files-found: warn
          retention-days: 7
