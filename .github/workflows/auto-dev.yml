name: Scheduled Auto Dev

on:
  # CLAUDE_CODE_OAUTH_TOKEN をリポジトリのSecretsに登録したら、下のscheduleのコメントを外して定期実行を有効にする。
  # schedule:
  #   # 毎日 03:00 JST (= 前日 18:00 UTC)
  #   - cron: "0 18 * * *"
  #   # 毎日 08:00 JST (= 前日 23:00 UTC)
  #   - cron: "0 23 * * *"
  #   # 毎日 13:00 JST (= 当日 04:00 UTC)
  #   - cron: "0 4 * * *"
  workflow_dispatch: {}

concurrency:
  group: auto-dev
  cancel-in-progress: false

jobs:
  auto-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Run Claude Code auto-dev
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}

            あなたはこのリポジトリの自動開発担当です。このワークフローは1回の起動(1セッション)に
            与えられた実行時間・トークンをできるだけ使い切ることを目的としており、
            タスクを1件実装して終わりにするのではなく、下記の手順を繰り返して
            **これ以上作業を続けられなくなるまで、あるいは未完了タスクがなくなるまで**
            複数タスクを次々に実装し続けてください。

            まず `git config user.name "github-actions[bot]"` と
            `git config user.email "github-actions[bot]@users.noreply.github.com"` を設定する。

            以下のループを繰り返す:

            1. `docs/auto-dev/TASKS.md` を読み、`### [ ]` で始まる(`[x]` でも `[!]` でもない)
               未完了タスクのうち最初の1件を選ぶ。該当するタスクが1件もなければ、ループを終了し
               何もせずワークフローを終了する。

            2. リポジトリの `CLAUDE.md` に書かれた開発ルールに従うこと。特に:
               - `src/domain` → `src/application` → `src/infrastructure` /
                 `src/presentation` のDDDレイヤー構成を守る
               - `domain`/`application` 層の新規ロジックは必ずテストを先に書く
                 (Red→Green→Refactor、AAAパターン)
               - `eslint.config.js` のルール(複雑度・ネスト・行数・命名規則など)を守る

            3. 選んだタスクを実装する。

            4. `npm run check`(lint + typecheck + test)を実行し、全て通ることを確認する。
               失敗する場合は原因を修正し、再度 `npm run check` を実行する。

            5a. `npm run check` が成功したら:
               - `docs/auto-dev/TASKS.md` の該当タスクの見出しを `### [ ]` から `### [x]` に書き換える
               - 実装差分(コードとTASKS.mdの更新)を `git add` し、実装内容が分かる
                 日本語のコミットメッセージでコミットする
               - `git rev-parse HEAD` で今コミットしたハッシュを取得する
               - `docs/auto-dev/IMPLEMENTATION_LOG.md` を開き、ファイル冒頭に書かれている
                 書式に従って、取得したコミットハッシュを含む新しい記録を
                 「## ログ一覧」見出し直後(＝一覧の先頭)に追記する。
                 「実装内容」は差分の丸写しではなく人間向けの要約、
                 「確認してほしいこと」は実際に画面やデータで確認すべき具体的な観点を書くこと
               - `TASKS.md` のタスク(`### [x]`/`### [!]`/`### [ ]` の見出し。「書式」の
                 サンプルは数えない)と `IMPLEMENTATION_LOG.md` の記録(`## ログ一覧` 以下の
                 `## YYYY-MM-DD ...` 見出し)がそれぞれ30件を超えていたら、古いものから
                 削除して直近30件までに収める(削除分の内容はgit履歴から参照できる)。
                 この削除はログ追記と同じコミットに含めてよい
               - `IMPLEMENTATION_LOG.md` の追記を `git add` し、
                 別コミットとして「実装ログを追記」のようなメッセージでコミットする
               - `git push origin HEAD:master` で直接 master に push する
               - 手順1に戻り、次の未完了タスクに着手する

            5b. 合理的な試行を重ねても `npm run check` を通せない場合は:
               - そのタスクのために加えたコード変更は `git checkout -- .` や
                 `git clean -fd` 等で破棄し、作業ツリーをクリーンな状態(直前のpush済みコミット)
                 に戻す(次のタスクに影響を残さないため)
               - `docs/auto-dev/TASKS.md` の該当タスクの見出しを `### [ ]` から `### [!]`
                 (自動実装が保留になったことを示すマーク)に書き換え、`git add` して
                 「(タスク名): 自動実装を保留」のようなメッセージで単独コミットし、
                 `git push origin HEAD:master` する
               - `gh issue create` で「どのタスクで何が原因で失敗したか」が分かるIssueを作成する
               - 同じタスクを再度選ばないよう、手順1に戻り次の未完了タスクに着手する
               (`[!]` を付けたタスクは人がTASKS.mdを見て原因を解消し `[ ]` に戻すまで
               自動実行の対象から外れる)

            6. ループを終了する条件は「未完了(`[ ]`)タスクがなくなったとき」のみとする。
               実行時間やトークンが尽きて処理を続けられなくなった場合は、その時点までに
               成功したタスクはコミット・push済みであるはずなので、そのまま終了してよい。
               自己判断で「今回はここまでにしておこう」と1〜数件で切り上げないこと。
          claude_args: |
            --max-turns 1000
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(npm:*),Bash(git:*),Bash(gh issue:*)"
