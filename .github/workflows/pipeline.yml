name: Development Pipeline

# 詳細は docs/pipeline/README.md を参照。
# discover -> spec-draft -> [ローカルの /spec-confirm コマンド] -> final-spec
#   -> implement(Codex) -> codex-review(Codex) -> claude-review -> [ユーザーが手動マージ] -> evaluate
# という8段のステージを、このワークフロー1本のステートマシンとして順に起動する。
# 各ステージは成功すると、最後のステップで次のステージを workflow_dispatch で呼び出す。

on:
  # CODEX_AUTH_JSON_B64 と CLAUDE_CODE_OAUTH_TOKEN をSecretsに登録し、通しで動作確認できたら
  # 下のscheduleのコメントを外す(discoverが定期実行され、パイプラインが自走するようになる)。
  # schedule:
  #   - cron: "0 18 * * *"  # 毎日 03:00 JST
  workflow_dispatch:
    inputs:
      stage:
        description: "実行するステージ"
        required: true
        type: choice
        options:
          - discover
          - spec-draft
          - final-spec
          - implement
          - codex-review
          - claude-review
          - evaluate
      slug:
        description: "機能スラッグ(docs/pipeline/<slug>/ を指す。discover以外は必須)"
        required: false
        type: string
  push:
    paths:
      - "docs/pipeline/*/03-confirmed-answers.md"
  pull_request:
    types: [closed]

concurrency:
  group: pipeline-${{ inputs.slug || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write

jobs:
  # workflow_dispatch / push / pull_request(マージ) のどの入口から来たかによらず、
  # 後続ジョブが見るべき stage と slug をここで1本化する。
  determine:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.set.outputs.stage }}
      slug: ${{ steps.set.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "stage=${{ inputs.stage }}" >> "$GITHUB_OUTPUT"
            echo "slug=${{ inputs.slug }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "stage=discover" >> "$GITHUB_OUTPUT"
            echo "slug=" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            FILE=$(git diff --name-only HEAD^ HEAD -- 'docs/pipeline/*/03-confirmed-answers.md' | head -1)
            SLUG=$(echo "$FILE" | sed -E 's#docs/pipeline/([^/]+)/03-confirmed-answers\.md#\1#')
            echo "stage=final-spec" >> "$GITHUB_OUTPUT"
            echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.pull_request.merged }}" = "true" ] && [[ "${{ github.event.pull_request.head.ref }}" == pipeline/* ]]; then
            REF="${{ github.event.pull_request.head.ref }}"
            echo "stage=evaluate" >> "$GITHUB_OUTPUT"
            echo "slug=${REF#pipeline/}" >> "$GITHUB_OUTPUT"
          else
            echo "stage=" >> "$GITHUB_OUTPUT"
            echo "slug=" >> "$GITHUB_OUTPUT"
          fi

  discover:
    needs: determine
    if: needs.determine.outputs.stage == 'discover'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Run feature-scout
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "*"
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}

            .claude/agents/feature-scout.md をReadツールで読み、その役割になりきって
            docs/pipeline/README.md の「discover」ステージを実行してください。

            機能を1件選んだら docs/pipeline/<slug>/01-discovered.md を書き、
            (docs/pipeline/USER_FIXES.md から採用した場合はその見出しの書き換えも含めて)
            git add し、「機能探索: <タイトル>」のような日本語のコミットメッセージ
            (末尾に "Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>" を付ける)で
            コミットして、git push origin HEAD:master を実行してください。
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Write,Glob,Grep,Bash(git:*)"
      - name: Trigger spec-draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=$(git log -1 --diff-filter=A --name-only --pretty=format: -- 'docs/pipeline/*/01-discovered.md' | head -1)
          SLUG=$(echo "$FILE" | sed -E 's#docs/pipeline/([^/]+)/01-discovered\.md#\1#')
          if [ -z "$SLUG" ]; then
            echo "01-discovered.md が見つからなかったため、次のステージは起動しません" >&2
            exit 1
          fi
          gh workflow run pipeline.yml -f stage=spec-draft -f slug="$SLUG"

  spec-draft:
    needs: determine
    if: needs.determine.outputs.stage == 'spec-draft'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SLUG: ${{ needs.determine.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Run spec-designer
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "*"
          prompt: |
            REPO: ${{ github.repository }}
            SLUG: ${{ env.SLUG }}

            .claude/agents/spec-designer.md をReadツールで読み、その役割になりきって、
            docs/pipeline/${{ env.SLUG }}/01-discovered.md に書かれた機能の仕様草案を
            docs/pipeline/${{ env.SLUG }}/02-draft-spec.md として書いてください
            (spec-designer.mdの「未決事項の書式」に従うこと)。

            書けたら git add し、「仕様設計(草案): ${{ env.SLUG }}」のようなコミットメッセージ
            (末尾に "Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>" を付ける)で
            コミットして、git push origin HEAD:master を実行してください。
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Write,Glob,Grep,Bash(git:*)"
      - name: ユーザ確定待ちのIssueを作成
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "仕様確定待ち: ${{ env.SLUG }}" \
            --body "docs/pipeline/${{ env.SLUG }}/02-draft-spec.md の未決事項を、ローカルのClaude Codeで \`/spec-confirm\` コマンドを実行して確定させてください。確定すると自動的に final-spec ステージが起動します。"

  final-spec:
    needs: determine
    if: needs.determine.outputs.stage == 'final-spec'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SLUG: ${{ needs.determine.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Run final-spec-writer
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "*"
          prompt: |
            REPO: ${{ github.repository }}
            SLUG: ${{ env.SLUG }}

            .claude/agents/final-spec-writer.md をReadツールで読み、その役割になりきって、
            docs/pipeline/${{ env.SLUG }}/02-draft-spec.md と
            docs/pipeline/${{ env.SLUG }}/03-confirmed-answers.md を統合し、
            docs/specs/${{ env.SLUG }}.md と docs/pipeline/${{ env.SLUG }}/04-final-spec.md を
            書いてください。

            書けたら git add し、「最終仕様: ${{ env.SLUG }}」のようなコミットメッセージ
            (末尾に "Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>" を付ける)で
            コミットして、git push origin HEAD:master を実行してください。
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Write,Glob,Grep,Bash(git:*)"
      - name: Trigger implement
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pipeline.yml -f stage=implement -f slug="${{ env.SLUG }}"

  implement:
    needs: determine
    if: needs.determine.outputs.stage == 'implement'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SLUG: ${{ needs.determine.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm install -g @openai/codex
      - name: Codex認証を復元する(ChatGPT Plusのセッション)
        env:
          CODEX_AUTH_JSON_B64: ${{ secrets.CODEX_AUTH_JSON_B64 }}
        run: |
          mkdir -p "$HOME/.codex"
          echo "$CODEX_AUTH_JSON_B64" | base64 -d > "$HOME/.codex/auth.json"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: ブランチを用意する(既存なら差し戻し実装、無ければ新規)
        id: branch
        run: |
          BRANCH="pipeline/${{ env.SLUG }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            echo "rework=true" >> "$GITHUB_OUTPUT"
          else
            git checkout -b "$BRANCH"
            echo "rework=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 実装プロンプトを組み立てる
        id: prompt
        run: |
          {
            echo "docs/specs/${{ env.SLUG }}.md の仕様に従って実装してください。"
            echo "CLAUDE.mdの開発ルール(DDDのレイヤー構成、domain/application層のTDD、eslint.config.jsの規約)に従うこと。"
            echo "実装が終わったら npm run check(lint + typecheck + test)を実行し、失敗する場合は原因を直してすべて通した状態で終えてください。"
            if [ -f "docs/pipeline/${{ env.SLUG }}/05-review-notes.md" ]; then
              echo ""
              echo "以下はこれまでのレビュー指摘です。特に blocker を優先して直してください。"
              echo ""
              cat "docs/pipeline/${{ env.SLUG }}/05-review-notes.md"
            fi
          } > /tmp/codex-prompt.txt
      - name: codex execで実装する
        id: codexrun
        run: |
          codex exec - \
            --sandbox workspace-write \
            --approve-for-me \
            --skip-git-repo-check \
            -o /tmp/codex-last-message.md \
            < /tmp/codex-prompt.txt
        continue-on-error: true
      - name: npm run checkで最終確認する
        id: check
        if: steps.codexrun.outcome == 'success'
        run: npm run check
        continue-on-error: true
      - name: 失敗時はIssueを作成して中断する
        if: steps.codexrun.outcome == 'failure' || steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Codex実装が完了しませんでした: ${{ env.SLUG }}" \
            --body "ブランチ pipeline/${{ env.SLUG }} の実装(codex exec または npm run check)が失敗しています。手動で確認してください。"
          exit 1
      - name: コミットしてPRを作成/更新する
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="pipeline/${{ env.SLUG }}"
          git add -A
          if ! git diff --cached --quiet; then
            if [ "${{ steps.branch.outputs.rework }}" = "true" ]; then
              git commit -m "Codex実装: ${{ env.SLUG }} のレビュー指摘に対応"
            else
              git commit -m "Codex実装: ${{ env.SLUG }}"
            fi
          fi
          git push origin "$BRANCH"
          if ! gh pr list --head "$BRANCH" --json number --jq '.[0].number' | grep -q '[0-9]'; then
            gh pr create \
              --head "$BRANCH" \
              --base master \
              --title "${{ env.SLUG }}" \
              --label codex-pipeline \
              --body-file /tmp/codex-last-message.md
          fi
      - name: Trigger codex-review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pipeline.yml -f stage=codex-review -f slug="${{ env.SLUG }}"

  codex-review:
    needs: determine
    if: needs.determine.outputs.stage == 'codex-review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SLUG: ${{ needs.determine.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install -g @openai/codex
      - name: Codex認証を復元する(ChatGPT Plusのセッション)
        env:
          CODEX_AUTH_JSON_B64: ${{ secrets.CODEX_AUTH_JSON_B64 }}
        run: |
          mkdir -p "$HOME/.codex"
          echo "$CODEX_AUTH_JSON_B64" | base64 -d > "$HOME/.codex/auth.json"
      - name: PRブランチをcheckoutする
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr checkout "pipeline/${{ env.SLUG }}"
      - name: codex execでレビューする
        run: |
          codex exec "docs/specs/${{ env.SLUG }}.md の受け入れ基準と、CLAUDE.mdのDDD構成・eslint規約に照らして、master からのこのブランチの差分(git diff master...HEAD)をレビューしてください。指摘があれば具体的な指摘を書いてください。最後に、直すべき指摘(blocker)が1件でもあれば最後の1行だけに NEEDS_FIX と書き、無ければ最後の1行だけに PASS と書いてください。" \
            --sandbox workspace-write \
            --approve-for-me \
            --skip-git-repo-check \
            -o /tmp/codex-verdict.md
      - name: レビュー結果をdocs/pipeline/<slug>/05-review-notes.mdに追記する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NOTES="docs/pipeline/${{ env.SLUG }}/05-review-notes.md"
          {
            echo ""
            echo "## $(date -u '+%Y-%m-%d %H:%M') UTC — Codex自己レビュー"
            echo ""
            cat /tmp/codex-verdict.md
          } >> "$NOTES"
          git add "$NOTES"
          git commit -m "Codex自己レビュー: ${{ env.SLUG }}"
          git push origin "pipeline/${{ env.SLUG }}"
      - name: 判定に応じてラベルを付け、次を起動する
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="pipeline/${{ env.SLUG }}"
          if tail -n 1 /tmp/codex-verdict.md | grep -q "NEEDS_FIX"; then
            gh pr edit "$BRANCH" --add-label changes-requested --remove-label codex-approved || true
            gh workflow run pipeline.yml -f stage=implement -f slug="${{ env.SLUG }}"
          else
            gh pr edit "$BRANCH" --add-label codex-approved --remove-label changes-requested || true
            gh workflow run pipeline.yml -f stage=claude-review -f slug="${{ env.SLUG }}"
          fi

  claude-review:
    needs: determine
    if: needs.determine.outputs.stage == 'claude-review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SLUG: ${{ needs.determine.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: PRブランチをcheckoutする
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr checkout "pipeline/${{ env.SLUG }}"
      - run: npm ci
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Run evaluator(claude-review)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "*"
          prompt: |
            REPO: ${{ github.repository }}
            SLUG: ${{ env.SLUG }}

            .claude/agents/evaluator.md をReadツールで読み、その役割になりきって、
            この開発パイプラインの「claude-review」として、docs/specs/${{ env.SLUG }}.md を
            仕様書に、現在のブランチ(master からの git diff master...HEAD)を対象の差分として
            レビューしてください。evaluator.mdの「開発パイプライン経由の場合」の指示に従い、
            docs/pipeline/${{ env.SLUG }}/05-review-notes.md に追記してください
            (末尾の判定見出しの文言は変えないこと)。

            書けたら git add し、「Claudeレビュー: ${{ env.SLUG }}」のようなコミットメッセージ
            (末尾に "Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>" を付ける)で
            コミットして、git push origin HEAD を実行してください。
          claude_args: |
            --model claude-sonnet-5
            --max-turns 60
            --allowedTools "Read,Write,Glob,Grep,Bash(npm:*),Bash(git:*)"
      - name: 判定に応じてラベルを付け、必要なら差し戻す
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="pipeline/${{ env.SLUG }}"
          NOTES="docs/pipeline/${{ env.SLUG }}/05-review-notes.md"
          if grep -q "## 判定: 要修正" "$NOTES" && [ "$(grep -o '## 判定: .*' "$NOTES" | tail -n 1)" = "## 判定: 要修正" ]; then
            gh pr edit "$BRANCH" --add-label changes-requested --remove-label claude-approved || true
            gh pr comment "$BRANCH" --body "Claudeレビューで修正が必要な指摘がありました。docs/pipeline/${{ env.SLUG }}/05-review-notes.md を参照してください。Codexによる再実装を起動します。"
            gh workflow run pipeline.yml -f stage=implement -f slug="${{ env.SLUG }}"
          else
            gh pr edit "$BRANCH" --add-label claude-approved --remove-label changes-requested || true
            gh pr comment "$BRANCH" --body "Claudeレビューが完了しました。指摘はありません。自動マージします。マージ後に評価ステージが自動で起動します。"
            gh pr merge "$BRANCH" --squash --delete-branch
          fi

  evaluate:
    needs: determine
    if: needs.determine.outputs.stage == 'evaluate'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SLUG: ${{ needs.determine.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Run evaluator(evaluate)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "*"
          prompt: |
            REPO: ${{ github.repository }}
            SLUG: ${{ env.SLUG }}

            .claude/agents/evaluator.md をReadツールで読み、その役割になりきって、
            この開発パイプラインの「evaluate」として、docs/specs/${{ env.SLUG }}.md を
            仕様書に、直近のマージコミット(pipeline/${{ env.SLUG }} だったブランチの内容、
            git log でコミット履歴を確認できる)を対象として評価し、
            docs/pipeline/${{ env.SLUG }}/06-evaluation.md に書いてください。

            書けたら git add し、「評価: ${{ env.SLUG }}」のようなコミットメッセージ
            (末尾に "Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>" を付ける)で
            コミットして、git push origin HEAD:master を実行してください。
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Write,Glob,Grep,Bash(npm:*),Bash(git:*)"
